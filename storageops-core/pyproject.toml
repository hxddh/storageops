[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "storageops-core"
version = "0.2.0"
description = "StorageOps core: parsers, analyzers, and secret scanner for object storage diagnostics"
requires-python = ">=3.9"
dependencies = []

# storageops-core uses a flat-module layout: each parser, analyzer, and util
# is a standalone .py file imported by flat name (e.g. `from parse_rclone_log import parse`).
# This design lets Pi Coding Agent call individual modules as tools without requiring the
# package to be installed. The storageops-cli bridges this via sys.path injection in
# storageops/__init__.py.
#
# There is intentionally no [tool.setuptools.packages.find] section here —
# storageops-core is not installed as a Python package; it is consumed via sys.path.
# Install storageops-cli instead: `pip install -e storageops-cli/`

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
