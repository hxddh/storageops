[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "storageops-core"
version = "0.2.0"
description = "StorageOps core: parsers, analyzers, and secret scanner for object storage diagnostics"
requires-python = ">=3.9"
dependencies = []

[tool.setuptools.packages.find]
where = ["."]
include = ["storageops_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
