[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "storageops"
version = "0.2.0"
description = "StorageOps CLI — object storage diagnostic toolkit for S3-compatible storage"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.100", "uvicorn>=0.22"]
mcp = ["mcp[cli]>=1.0"]
repl = ["prompt_toolkit>=3.0"]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
storageops = "storageops.cli:main"

# storageops-core (parsers, analyzers, utils) is bundled into this wheel via
# package-dir mappings so that `pip install storageops` works without the repo.
# The flat-import pattern (e.g. `from parse_rclone_log import parse`) is preserved:
# storageops/__init__.py adds the installed sub-package directories to sys.path.
[tool.setuptools]
packages = [
    "storageops",
    "storageops.core",
    "storageops.ui",
    "storageops.cli",
    "storageops.runtime",
    "storageops._parsers",
    "storageops._analyzers",
    "storageops._utils",
]

[tool.setuptools.package-dir]
"storageops._parsers"   = "../storageops-core/parsers"
"storageops._analyzers" = "../storageops-core/analyzers"
"storageops._utils"     = "../storageops-core/utils"

[tool.setuptools.package-data]
"storageops" = [
    "prompts/*",
    "static/*",
    "static/**/*",
    "pi_diagnosis_prompt.md",
    "_skills/*",
    "_skills/**",
    "_skills/**/*",
]
"storageops._parsers"   = ["*.py"]
"storageops._analyzers" = ["*.py"]
"storageops._utils"     = ["*.py"]

[tool.pytest.ini_options]
testpaths = ["../storageops-core/tests", "tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py39"
