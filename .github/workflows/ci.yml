name: StorageOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CLI + dev dependencies
        run: |
          pip install -e storageops-cli/
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest storageops-core/tests/ -v

      - name: Smoke tests (standalone script, backwards compat)
        run: python storageops-core/tests/smoke_test.py

      - name: Validation (5 real-world cases)
        run: python tests/validation/run_validation.py

      - name: Agent — rclone corrupted transfer
        run: |
          storageops agent agents/skills/storageops-eval-golden-cases/cases/rclone-corrupted-transfer/input/rclone-debug.log

      - name: Agent — secrets in log (redaction test)
        run: |
          storageops agent tests/validation/inputs/secrets-in-log.log

      - name: Triage — classifies SignatureDoesNotMatch correctly
        run: |
          result=$(storageops triage agents/skills/storageops-eval-golden-cases/cases/signature-clock-skew/input/error-response.xml)
          echo "$result" | python -c "import sys,json; d=json.load(sys.stdin); assert d['primary_domain'] == 's3_protocol_compatibility', f'Expected s3_protocol_compatibility, got {d[\"primary_domain\"]}'"
          echo "✓ Triage correctly classified s3_protocol_compatibility"

      - name: Eval — rclone-corrupted-transfer golden case
        run: |
          storageops agent agents/skills/storageops-eval-golden-cases/cases/rclone-corrupted-transfer/input/rclone-debug.log > /tmp/rclone-corrupted-transfer.md 2>/dev/null || true
          storageops eval \
            --cases-dir agents/skills/storageops-eval-golden-cases/cases \
            --outputs-dir /tmp \
            --case rclone-corrupted-transfer || echo "Eval score noted (not blocking)"
