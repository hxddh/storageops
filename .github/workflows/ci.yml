name: StorageOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          pip install -e .
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check storageops/

      - name: Unit tests (pytest)
        run: pytest storageops/tests_core/ -v

      - name: Smoke tests
        run: python storageops/tests_core/smoke_test.py

      - name: Import check
        run: |
          python -c "from storageops.session import Session; print('session OK')"
          python -c "from storageops.agent import converse; print('agent OK')"
          python -c "from storageops.pi_runtime import PiRuntime; print('pi_runtime OK')"
          python -c "from storageops.parsers.parse_rclone_log import parse; print('parsers OK')"
          python -c "from storageops.analyzers.detect_throttling import detect; print('analyzers OK')"
          python -c "import storageops; print(storageops.__version__)"
