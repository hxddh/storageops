name: StorageOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CLI
        run: pip install -e storageops-cli/

      - name: Smoke tests
        run: python storageops-core/tests/smoke_test.py

      - name: Validation
        run: python tests/validation/run_validation.py

      - name: Agent diagnosis + eval (rclone)
        run: |
          # Generate diagnosis from the golden case input
          storageops agent agents/skills/storageops-eval-golden-cases/cases/rclone-corrupted-transfer/input/rclone-debug.log > /tmp/diagnosis.md
          
          # Copy to eval outputs dir with expected name
          mkdir -p /tmp/eval-outputs
          cp /tmp/diagnosis.md /tmp/eval-outputs/rclone-corrupted-transfer.md
          
          # Run eval
          storageops eval \
            --cases-dir agents/skills/storageops-eval-golden-cases/cases \
            --outputs-dir /tmp/eval-outputs \
            --case rclone-corrupted-transfer

      - name: Agent non-interactive test
        run: |
          storageops agent agents/skills/storageops-eval-golden-cases/cases/rclone-corrupted-transfer/input/rclone-debug.log

      - name: Triage test
        run: |
          result=$(storageops triage agents/skills/storageops-eval-golden-cases/cases/signature-clock-skew/input/error-response.xml)
          echo "$result" | python -c "import sys,json; d=json.load(sys.stdin); assert d['primary_domain'] == 's3_protocol_compatibility', f'Expected s3_protocol_compatibility, got {d[\"primary_domain\"]}'"
          echo "✓ Triage correctly classified"
