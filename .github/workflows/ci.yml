name: StorageOps CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate skills
        run: python scripts/skill_integrity_check.py

      - name: Check hardcoded pricing
        run: python scripts/no_hardcoded_pricing.py

      - name: Check reference scope
        run: python scripts/reference_scope_check.py

      - name: Check provider scope
        run: python scripts/provider_scope_check.py

      - name: Check output contract
        run: python scripts/contract_check.py

      - name: Check eval coverage floor
        run: python scripts/coverage_check.py

      - name: Validate golden cases
        run: python skills/storageops-eval-golden-cases/scripts/golden_case_validator.py skills/storageops-eval-golden-cases/cases

      - name: Validate routing contract
        run: python scripts/routing_contract_check.py

      - name: Check repository size gates
        run: python scripts/repo_size_gate.py

      - name: Evaluate baseline outputs
        run: |
          python skills/storageops-eval-golden-cases/scripts/eval_all.py \
            --cases skills/storageops-eval-golden-cases/cases \
            --outputs skills/storageops-eval-golden-cases/baseline-outputs \
            --only-with-outputs \
            --json-out /tmp/storageops-eval.json

      - name: Run tests
        run: python -m pytest

  package:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -e '.[dev]'

      - name: Validate wheel and sdist contents
        run: python scripts/package_check.py

  check-extension:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate extension
        run: |
          echo "=== Checking extension file ==="
          if [ ! -f storageops_cli/extensions/storageops.ts ]; then
            echo "ERROR: Extension file not found at storageops_cli/extensions/storageops.ts"
            exit 1
          fi
          if ! grep -q "scan_secrets" storageops_cli/extensions/storageops.ts; then
            echo "ERROR: scan_secrets tool not found in extension"
            exit 1
          fi
          if ! grep -q "detect_domain" storageops_cli/extensions/storageops.ts; then
            echo "ERROR: detect_domain tool not found in extension"
            exit 1
          fi
          if ! grep -q "search_memory" storageops_cli/extensions/storageops.ts; then
            echo "ERROR: search_memory tool not found in extension"
            exit 1
          fi
          if ! grep -q "capture_http_trace" storageops_cli/extensions/storageops.ts; then
            echo "ERROR: capture_http_trace tool not found in extension"
            exit 1
          fi
          echo "Extension validated."

  check-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate documentation
        run: |
          echo "=== Checking document files ==="
          for doc in README.md AGENTS.md CONTRIBUTING.md docs/getting-started.md docs/tutorial.md docs/cli-reference.md docs/quick-reference.md docs/ARCHITECTURE.md; do
            if [ ! -f "$doc" ]; then
              echo "ERROR: $doc not found"
              exit 1
            fi
            echo "  OK: $doc ($(wc -l < $doc) lines)"
          done
          echo "All docs validated."

  # Clean-room install validation: proves the literal first-touch path
  # (pip install wheel -> storageops install -> storageops --version) on a fresh
  # machine every run. No model key required (install does not need one).
  install-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build wheel with bundled httpmon
        run: |
          python -m pip install --upgrade pip build
          python scripts/prepare_httpmon_vendor.py
          python -m build --wheel
      - name: Install from the built wheel
        run: pip install dist/*.whl
      - name: storageops install (fresh machine)
        run: storageops install
      - name: Validate readiness output
        run: |
          set -e
          storageops --version
          storageops --version | grep -q "StorageOps v"
          storageops --version | grep -q "independent install : yes"
          storageops --version | grep -Eq "pi: [0-9]+\."
          # No key in CI, so honest reporting must say "not configured".
          storageops --version | grep -Eq "api key .*: not configured"
          # Packaging guard: every diagnostic skill pack must actually deploy.
          test "$(ls "$HOME/.storageops/skills" | grep -c '^storageops-')" -ge 15
          echo "install-smoke OK"

  # End-to-end diagnosis smoke: proves the product's actual job (a correct
  # diagnosis) end-to-end. Runs ONLY when a model-key secret is configured, so it
  # is a no-op until enabled. To turn it on, set:
  #   secret  STORAGEOPS_MODEL_KEY   (a model provider API key)
  #   var     STORAGEOPS_PROVIDER    (e.g. deepseek; default: deepseek)
  #   var     STORAGEOPS_MODEL       (e.g. deepseek-v4-pro; default: deepseek-v4-pro)
  diagnosis-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Gate on model-key secret
        id: gate
        env:
          MODEL_KEY: ${{ secrets.STORAGEOPS_MODEL_KEY }}
        run: |
          if [ -z "$MODEL_KEY" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No STORAGEOPS_MODEL_KEY secret set; skipping end-to-end diagnosis smoke."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Install storageops + Pi
        if: steps.gate.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip build
          python scripts/prepare_httpmon_vendor.py
          python -m build --wheel
          pip install dist/*.whl
          storageops install
      - name: Run a diagnosis and evaluate it
        if: steps.gate.outputs.present == 'true'
        env:
          MODEL_KEY: ${{ secrets.STORAGEOPS_MODEL_KEY }}
          PROVIDER: ${{ vars.STORAGEOPS_PROVIDER }}
          MODEL: ${{ vars.STORAGEOPS_MODEL }}
        run: |
          set -e
          CASE=skills/storageops-eval-golden-cases/cases/throttling-hot-prefix
          INPUT=$(ls "$CASE"/input/* | head -1)
          storageops --provider "${PROVIDER:-deepseek}" --model "${MODEL:-deepseek-v4-pro}" \
            --api-key "$MODEL_KEY" --print @"$INPUT" \
            'Diagnose the root cause and safe next steps' > /tmp/diag.md
          echo "----- diagnosis output (head) -----"; head -40 /tmp/diag.md
          test -s /tmp/diag.md
          # eval_runner exits non-zero on HARD_FAIL (wrong category, low confidence,
          # missing required evidence, or forbidden/unsafe output).
          python skills/storageops-eval-golden-cases/scripts/eval_runner.py \
            --case "$CASE" --output /tmp/diag.md

  # Behavioral unit tests for the 4 extension tools. Runs the real functions via
  # node:test. The extension's only runtime import is `typebox` (used solely
  # inside the default export, which these tests do not call), so a one-line local
  # stub satisfies the import without any external dependency.
  tool-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Behavioral tests for extension tools
        run: |
          mkdir -p node_modules/typebox
          printf '{"name":"typebox","version":"0.0.0","type":"module","exports":"./index.js"}' > node_modules/typebox/package.json
          printf 'export const Type = {};\n' > node_modules/typebox/index.js
          node --experimental-strip-types --test tests/extension/*.test.ts
