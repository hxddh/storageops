name: Publish to PyPI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      should_publish: ${{ steps.version.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check version metadata
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          PKG_VER=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "Package version: $PKG_VER"
          echo "package_version=$PKG_VER" >> "$GITHUB_OUTPUT"

          if [[ "${REF_TYPE}" == "tag" ]]; then
            TAG_VER="${REF_NAME#v}"
            if [[ "$TAG_VER" != "$PKG_VER" ]]; then
              echo "ERROR: tag $TAG_VER does not match pyproject.toml version $PKG_VER"
              exit 1
            fi
            echo "Tag version $TAG_VER matches pyproject.toml"
          else
            echo "Preflight for package version $PKG_VER"
          fi

          EXISTS=$(python3 - "$PKG_VER" <<'PY'
          import json
          import sys
          import urllib.error
          import urllib.request

          version = sys.argv[1]
          try:
              with urllib.request.urlopen("https://pypi.org/pypi/storageops/json", timeout=20) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print("false")
                  raise SystemExit(0)
              raise

          print("true" if version in data.get("releases", {}) else "false")
          PY
          )

          echo "PyPI already has $PKG_VER: $EXISTS"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          elif [[ "$EXISTS" == "true" ]]; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and run quality gates
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'
          python scripts/skill_integrity_check.py
          python -m pytest

      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python scripts/prepare_httpmon_vendor.py
          python -m build
          python -m twine check dist/*

      - name: Verify package assets
        run: python scripts/package_check.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: storageops-dist
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: needs.build.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write   # required for PyPI Trusted Publisher (OIDC, no token needed)
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: storageops-dist
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
