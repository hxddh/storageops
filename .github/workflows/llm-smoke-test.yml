name: Pipeline Smoke Test

# Runs rule-based triage → analyze → report validation on a golden case.
# No LLM or Pi required. Triggers on manual dispatch or 'smoke-test' PR label.
on:
  workflow_dispatch:
    inputs:
      case:
        description: "Golden case name (default: rclone-corrupted-transfer)"
        required: false
        default: "rclone-corrupted-transfer"
  pull_request:
    types: [labeled]

jobs:
  smoke:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && github.event.label.name == 'smoke-test')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e storageops-core
          pip install -e storageops-cli

      - name: Run pipeline smoke test
        env:
          STORAGEOPS_SMOKE_CASE: ${{ github.event.inputs.case || 'rclone-corrupted-transfer' }}
        run: python .github/scripts/pi_smoke_test.py
